# Conda environment for the Image and Video Compression lab course (privc/).
#
# Create:   conda env create -f environment.yml
# Activate: conda activate privc
# Update:   conda env update -f environment.yml --prune
#

name: privc

channels:
  - conda-forge

dependencies:
  - python=3.10
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - bitstring>=4.0,<5.0
  - matplotlib>=3.7
  - pillow>=9.0
  - scikit-image>=0.20
  - scikit-learn>=1.2
  - parameterized>=0.9
  - jupyterlab>=4.0
  - ipykernel>=6.0
